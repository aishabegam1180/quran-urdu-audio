# Builds the Android app (APK) and publishes it to the "app" release.
# Install link: https://github.com/<owner>/<repo>/releases/download/app/QuranUrduAudio.apk
name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [scripts/**, .github/workflows/import-audio.yml, "**.md"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo prebuild --platform android --no-install
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Publish to the "app" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk QuranUrduAudio.apk
          gh release view app >/dev/null 2>&1 || \
            gh release create app --title "Android app" --notes "Download QuranUrduAudio.apk on your phone and install it."
          gh release upload app QuranUrduAudio.apk --clobber
          echo "APK: https://github.com/${{ github.repository }}/releases/download/app/QuranUrduAudio.apk" >> "$GITHUB_STEP_SUMMARY"
